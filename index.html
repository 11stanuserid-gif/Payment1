<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Synex Pay v4.0 | Payment Testing</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      background: #0a0f1a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2a3348;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .header h1 span { color: #00d4ff; }
    .header p { color: #9ca3af; font-size: 0.85rem; margin-top: 0.3rem; }
    
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }
    
    label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #2a3348;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      color: white;
      font-size: 1rem;
      outline: none;
      margin-bottom: 1rem;
      transition: 0.2s;
    }
    input:focus { border-color: #00d4ff; }
    
    .btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary { background: #00d4ff; color: #0a0f1a; }
    .btn-primary:hover { background: #00b8e6; }
    .btn-success { background: #00ff88; color: #0a0f1a; }
    .btn-success:hover { background: #00e67a; }
    .btn-outline { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; }
    .btn-outline:hover { background: rgba(0,212,255,0.1); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .result-box {
      background: #0f172a;
      border: 1px solid #2a3348;
      border-radius: 12px;
      padding: 1.2rem;
      margin-top: 1rem;
      text-align: center;
    }
    .qr-wrapper {
      background: white;
      display: inline-block;
      padding: 0.8rem;
      border-radius: 12px;
      margin: 1rem 0;
    }
    .qr-wrapper img { display: block; }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #9ca3af;
      margin: 0.3rem 0;
    }
    .info-row strong { color: #e5e7eb; }
    
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1f2937;
      border-left: 4px solid #00d4ff;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      z-index: 999;
      animation: slideIn 0.3s;
      font-size: 0.9rem;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .hidden { display: none !important; }
    
    .timer {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f59e0b;
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .status-paid { background: rgba(0,255,136,0.2); color: #00ff88; }
    .status-expired { background: rgba(255,51,102,0.2); color: #ff3366; }
    .status-failed { background: rgba(255,51,102,0.2); color: #ff3366; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>⬡ Synex<span>Pay</span> v4.0</h1>
        <p>Enterprise UPI Payment Testing</p>
      </div>
      
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>

      <!-- Step 1: Create Payment -->
      <div id="createSection">
        <label>💰 Payment Amount (₹)</label>
        <input type="number" id="amountInput" placeholder="Enter amount (₹1 - ₹100,000)" value="100" min="1" max="100000" step="1">
        
        <label>📝 Note (Optional)</label>
        <input type="text" id="noteInput" placeholder="What's this payment for?">
        
        <button class="btn btn-primary" id="generateBtn">
          ⚡ Generate Payment
        </button>
      </div>

      <!-- Step 2: Payment Result -->
      <div id="resultSection" class="hidden">
        <div class="result-box">
          <p style="margin-bottom:0.5rem;">Scan QR or use UPI app to pay</p>
          <div class="qr-wrapper" id="qrContainer"></div>
          
          <div class="info-row"><span>Payment ID</span><strong id="displayId">—</strong></div>
          <div class="info-row"><span>Amount</span><strong id="displayAmount">—</strong></div>
          <div class="info-row"><span>UPI ID</span><strong>aqdaskhan03@fam</strong></div>
          <div class="info-row"><span>Status</span><span class="status-badge status-pending" id="displayStatus">PENDING</span></div>
          <div class="info-row"><span>Expires In</span><strong class="timer" id="countdownTimer">—</strong></div>
          
          <button class="btn btn-success" id="simulateBtn" style="margin-top:1rem;">
            🧪 Simulate Payment (Test)
          </button>
          <button class="btn btn-outline" id="newPaymentBtn" style="margin-top:0.5rem;">
            🔄 Create New Payment
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ──────────────────────────────────────────────
      // AUTO-CONFIGURATION
      // ──────────────────────────────────────────────
      const BACKEND_URL = 'https://our-payment-gateway.onrender.com';
      const ADMIN_KEY = 'admin_synex_2026';
      let API_KEY = '';
      let socket = null;
      let currentPaymentId = null;
      let countdownInterval = null;
      let expiryTimeout = null;

      // ──────────────────────────────────────────────
      // DOM ELEMENTS
      // ──────────────────────────────────────────────
      const $ = (sel) => document.querySelector(sel);
      const statusDot = $('#statusDot');
      const statusText = $('#statusText');
      const createSection = $('#createSection');
      const resultSection = $('#resultSection');
      const generateBtn = $('#generateBtn');
      const simulateBtn = $('#simulateBtn');
      const newPaymentBtn = $('#newPaymentBtn');
      const amountInput = $('#amountInput');
      const noteInput = $('#noteInput');
      const qrContainer = $('#qrContainer');
      const displayId = $('#displayId');
      const displayAmount = $('#displayAmount');
      const displayStatus = $('#displayStatus');
      const countdownTimer = $('#countdownTimer');

      // ──────────────────────────────────────────────
      // TOAST NOTIFICATION
      // ──────────────────────────────────────────────
      function toast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = 'toast';
        el.style.borderLeftColor = type === 'success' ? '#00ff88' : type === 'error' ? '#ff3366' : '#00d4ff';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      // ──────────────────────────────────────────────
      // AUTO-FETCH API KEY
      // ──────────────────────────────────────────────
      async function autoFetchApiKey() {
        try {
          const res = await fetch(`${BACKEND_URL}/api/v1/admin/keys`, {
            headers: { 'X-Admin-Key': ADMIN_KEY }
          });
          const data = await res.json();
          if (data.keys && data.keys.length > 0) {
            API_KEY = data.keys[0].secret;
            console.log('✅ API Key auto-fetched:', API_KEY.slice(0, 16) + '...');
            return true;
          }
        } catch (e) {
          console.warn('⚠️ Could not auto-fetch API key:', e.message);
        }
        return false;
      }

      // ──────────────────────────────────────────────
      // API HELPER
      // ──────────────────────────────────────────────
      async function api(path, options = {}) {
        const headers = {
          'Content-Type': 'application/json',
          'X-Api-Key': API_KEY
        };
        const res = await fetch(`${BACKEND_URL}${path}`, { headers, ...options });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        return res.json();
      }

      // ──────────────────────────────────────────────
      // SOCKET.IO
      // ──────────────────────────────────────────────
      function connectSocket() {
        if (socket) socket.disconnect();
        socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });
        
        socket.on('connect', () => {
          statusDot.style.background = '#00ff88';
          statusDot.style.boxShadow = '0 0 10px #00ff88';
          statusText.textContent = 'Connected';
        });
        
        socket.on('disconnect', () => {
          statusDot.style.background = '#ff3366';
          statusDot.style.boxShadow = '0 0 10px #ff3366';
          statusText.textContent = 'Disconnected';
        });

        // Listen for payment success
        socket.on('payment_success', (data) => {
          if (data.paymentId === currentPaymentId) {
            toast('✅ Payment Received!', 'success');
            updatePaymentStatus('paid');
            clearInterval(countdownInterval);
          }
        });

        // Listen for payment expired
        socket.on('payment_expired', (data) => {
          if (data.paymentId === currentPaymentId) {
            toast('⏰ Payment Expired', 'error');
            updatePaymentStatus('expired');
            clearInterval(countdownInterval);
          }
        });
      }

      // ──────────────────────────────────────────────
      // UPDATE PAYMENT STATUS
      // ──────────────────────────────────────────────
      function updatePaymentStatus(status) {
        displayStatus.textContent = status.toUpperCase();
        displayStatus.className = 'status-badge';
        
        switch(status) {
          case 'pending':
            displayStatus.classList.add('status-pending');
            break;
          case 'paid':
            displayStatus.classList.add('status-paid');
            simulateBtn.disabled = true;
            break;
          case 'expired':
            displayStatus.classList.add('status-expired');
            simulateBtn.disabled = true;
            break;
          case 'failed':
            displayStatus.classList.add('status-failed');
            simulateBtn.disabled = true;
            break;
        }
      }

      // ──────────────────────────────────────────────
      // START COUNTDOWN TIMER
      // ──────────────────────────────────────────────
      function startCountdown(expiresInSeconds) {
        clearInterval(countdownInterval);
        let remaining = expiresInSeconds;
        
        const updateTimer = () => {
          if (remaining <= 0) {
            countdownTimer.textContent = 'Expired';
            clearInterval(countdownInterval);
            return;
          }
          const mins = Math.floor(remaining / 60);
          const secs = remaining % 60;
          countdownTimer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
          remaining--;
        };
        
        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
      }

      // ──────────────────────────────────────────────
      // GENERATE PAYMENT
      // ──────────────────────────────────────────────
      async function generatePayment() {
        const amount = parseFloat(amountInput.value);
        const note = noteInput.value.trim();
        
        // Validation
        if (!amount || amount < 1 || amount > 100000) {
          toast('Please enter amount between ₹1 and ₹100,000', 'error');
          return;
        }
        
        generateBtn.disabled = true;
        generateBtn.textContent = '⏳ Creating...';
        
        try {
          const data = await api('/api/v1/payment/create', {
            method: 'POST',
            body: JSON.stringify({
              amount: amount,
              note: note || 'Test Payment',
              customer: {
                name: 'Test User',
                phone: '9999999999',
                email: 'test@synexpay.com'
              },
              expiryMinutes: 15
            })
          });
          
          // Store payment ID
          currentPaymentId = data.paymentId;
          
          // Display results
          createSection.classList.add('hidden');
          resultSection.classList.remove('hidden');
          
          // QR Code
          qrContainer.innerHTML = `<img src="${data.qrCode}" width="200" height="200" alt="QR Code">`;
          
          // Details
          displayId.textContent = data.paymentId.slice(0, 16) + '...';
          displayAmount.textContent = '₹' + data.amount.toFixed(2);
          updatePaymentStatus('pending');
          
          // Countdown
          startCountdown(data.expiresIn || 900); // 15 min default
          
          // Subscribe to socket room
          socket.emit('subscribe_payment', data.paymentId);
          
          toast('✅ Payment generated! Scan QR or simulate.', 'success');
          
        } catch (err) {
          toast('❌ Error: ' + err.message, 'error');
          console.error(err);
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = '⚡ Generate Payment';
        }
      }

      // ──────────────────────────────────────────────
      // SIMULATE PAYMENT
      // ──────────────────────────────────────────────
      async function simulatePayment() {
        if (!currentPaymentId) return;
        
        simulateBtn.disabled = true;
        simulateBtn.textContent = '⏳ Simulating...';
        
        try {
          const data = await api(`/api/v1/payment/simulate/${currentPaymentId}`, {
            method: 'POST'
          });
          
          toast(`🧪 Payment simulated! Confirming in ${Math.floor(data.delay/1000)}s...`, 'success');
          
          // Socket will update status automatically
          setTimeout(() => {
            updatePaymentStatus('paid');
            clearInterval(countdownInterval);
            simulateBtn.textContent = '✅ Paid';
          }, data.delay || 2000);
          
        } catch (err) {
          toast('❌ Simulation failed: ' + err.message, 'error');
          simulateBtn.disabled = false;
          simulateBtn.textContent = '🧪 Simulate Payment (Test)';
        }
      }

      // ──────────────────────────────────────────────
      // NEW PAYMENT
      // ──────────────────────────────────────────────
      function newPayment() {
        currentPaymentId = null;
        clearInterval(countdownInterval);
        createSection.classList.remove('hidden');
        resultSection.classList.add('hidden');
        generateBtn.disabled = false;
        simulateBtn.disabled = false;
        simulateBtn.textContent = '🧪 Simulate Payment (Test)';
        amountInput.value = '100';
        noteInput.value = '';
        amountInput.focus();
      }

      // ──────────────────────────────────────────────
      // INITIALIZATION
      // ──────────────────────────────────────────────
      async function init() {
        statusText.textContent = 'Fetching API key...';
        
        const keyFetched = await autoFetchApiKey();
        
        if (!keyFetched) {
          statusText.textContent = '⚠️ API key not found';
          toast('Could not auto-fetch API key. Check backend.', 'error');
          return;
        }
        
        connectSocket();
        
        // Event listeners
        generateBtn.addEventListener('click', generatePayment);
        simulateBtn.addEventListener('click', simulatePayment);
        newPaymentBtn.addEventListener('click', newPayment);
        
        // Enter key to generate
        amountInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') generatePayment();
        });
        
        // Auto-focus amount input
        amountInput.focus();
        
        statusText.textContent = 'Ready — Enter amount & generate';
        console.log('🚀 Synex Pay Testing Dashboard Ready');
        console.log('📋 API Key:', API_KEY.slice(0, 16) + '...');
        console.log('🔗 Backend:', BACKEND_URL);
      }

      // Start
      init().catch(err => {
        console.error('Init error:', err);
        toast('Failed to initialize', 'error');
      });

    })();
  </script>
</body>
</html>
